spring.application.name=user-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/rideshare_userdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Configuration
server.port=8081

# Logging Configuration
logging.level.root=INFO
logging.level.com.rideshare.user=DEBUG
logging.level.com.rideshare.user.controller=INFO
logging.level.com.rideshare.user.service=INFO
logging.level.com.rideshare.user.config=DEBUG
logging.level.com.rideshare.user.exception=WARN

# Spring Security Logging
logging.level.org.springframework.security=DEBUG

# Database Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{50}] - %msg%n

# Log file configuration
logging.file.name=logs/user-service.log
logging.file.max-size=10MB
logging.file.max-history=30
